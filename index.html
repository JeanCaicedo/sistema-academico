<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistema Académico</title>
<style>
  :root{
    --nav:#16273f; --nav2:#1e3454; --primary:#1f5fae; --primary-d:#174a8a;
    --bg:#eef1f6; --card:#ffffff; --line:#dde3ec; --text:#1e2a3a; --muted:#6b7688;
    --ok:#1e8e5a; --okbg:#e5f5ec; --warn:#b4690e; --warnbg:#fdf2e2; --bad:#c0392b; --badbg:#fbe9e7;
    --accent:#e8a030;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{font-family:"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:14px;}
  button{font-family:inherit;cursor:pointer;}
  a{color:var(--primary);text-decoration:none;}

  /* LOGIN */
  #login{min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,#16273f 0%,#1f5fae 100%);padding:20px;}
  .login-card{background:#fff;border-radius:14px;box-shadow:0 20px 50px rgba(0,0,0,.3);width:100%;max-width:820px;overflow:hidden;}
  .login-head{padding:28px 34px 10px;text-align:center;}
  .brand{display:flex;align-items:center;justify-content:center;gap:12px;}
  .logo{width:44px;height:44px;border-radius:10px;background:var(--primary);color:#fff;display:grid;place-items:center;font-weight:800;font-size:20px;}
  .login-head h1{margin:14px 0 2px;font-size:22px;color:var(--nav);}
  .login-head p{margin:0;color:var(--muted);}
  .roles{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;padding:24px 34px 10px;}
  .role{border:1px solid var(--line);border-radius:12px;padding:18px 12px;text-align:center;background:#fff;transition:.15s;}
  .role:hover{border-color:var(--primary);box-shadow:0 6px 18px rgba(31,95,174,.15);transform:translateY(-2px);}
  .role .ic{font-size:30px;margin-bottom:8px;}
  .role b{display:block;color:var(--nav);}
  .role small{color:var(--muted);}
  .login-foot{padding:14px 34px 26px;color:var(--muted);text-align:center;font-size:12.5px;border-top:1px solid var(--line);margin-top:14px;}

  /* APP SHELL */
  #app{display:none;min-height:100vh;}
  .shell{display:flex;min-height:100vh;}
  .sidebar{width:240px;background:var(--nav);color:#c8d3e4;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;}
  .sb-brand{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid #26405f;}
  .sb-brand .logo{width:34px;height:34px;font-size:16px;}
  .sb-brand span{color:#fff;font-weight:700;font-size:15px;line-height:1.1;}
  .sb-role{padding:12px 18px;font-size:11.5px;letter-spacing:.5px;text-transform:uppercase;color:#7f93b0;}
  .menu{list-style:none;margin:0;padding:0 8px;flex:1;overflow:auto;}
  .menu li{margin:2px 0;}
  .menu a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;color:#c8d3e4;font-size:13.5px;}
  .menu a .mi{width:20px;text-align:center;}
  .menu a:hover{background:#21395a;color:#fff;}
  .menu a.active{background:var(--primary);color:#fff;font-weight:600;}
  .sb-foot{padding:14px 18px;border-top:1px solid #26405f;font-size:11.5px;color:#7f93b0;}

  .main{flex:1;display:flex;flex-direction:column;min-width:0;}
  .topbar{height:60px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:5;}
  .crumbs{color:var(--muted);font-size:13px;}
  .crumbs b{color:var(--text);}
  .user{display:flex;align-items:center;gap:12px;}
  .avatar{width:36px;height:36px;border-radius:50%;background:var(--primary);color:#fff;display:grid;place-items:center;font-weight:700;}
  .user .u-name{font-weight:600;font-size:13px;}
  .user .u-role{font-size:11.5px;color:var(--muted);}
  .btn-out{border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:8px;padding:7px 12px;font-size:12.5px;}
  .btn-out:hover{background:var(--bg);}

  .content{padding:26px 28px;flex:1;}
  .page-title{font-size:20px;font-weight:700;margin:0 0 4px;color:var(--nav);}
  .page-sub{color:var(--muted);margin:0 0 20px;}

  /* COMPONENTS */
  .cards{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px;}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;}
  .stat .s-ic{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;font-size:20px;margin-bottom:10px;}
  .stat .s-val{font-size:26px;font-weight:800;color:var(--nav);line-height:1;}
  .stat .s-lab{color:var(--muted);font-size:12.5px;margin-top:4px;}

  .panel{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:20px;overflow:hidden;}
  .panel-h{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line);}
  .panel-h h3{margin:0;font-size:15px;color:var(--nav);}
  .panel-b{padding:16px 18px;}
  .panel-b.flush{padding:0;}

  table{width:100%;border-collapse:collapse;font-size:13px;}
  th,td{text-align:left;padding:11px 16px;border-bottom:1px solid var(--line);}
  th{background:#f6f8fb;color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.3px;}
  tbody tr:hover{background:#f7f9fc;}
  td.actions{white-space:nowrap;}

  .badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11.5px;font-weight:600;}
  .b-ok{background:var(--okbg);color:var(--ok);}
  .b-warn{background:var(--warnbg);color:var(--warn);}
  .b-bad{background:var(--badbg);color:var(--bad);}
  .b-info{background:#e7f0fb;color:var(--primary);}
  .b-gray{background:#eceff3;color:var(--muted);}

  .btn{border:none;border-radius:8px;padding:9px 16px;font-size:13px;font-weight:600;}
  .btn-p{background:var(--primary);color:#fff;}
  .btn-p:hover{background:var(--primary-d);}
  .btn-s{background:#fff;border:1px solid var(--line);color:var(--text);}
  .btn-s:hover{background:var(--bg);}
  .btn-sm{padding:6px 11px;font-size:12px;}
  .btn-link{background:none;border:none;color:var(--primary);padding:4px 6px;font-weight:600;font-size:12.5px;}
  .btn-link:hover{text-decoration:underline;}

  .toolbar{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap;}
  .search{flex:1;min-width:200px;position:relative;}
  .search input{width:100%;padding:9px 12px 9px 34px;border:1px solid var(--line);border-radius:8px;font-size:13px;background:#fff;}
  .search .si{position:absolute;left:11px;top:9px;color:var(--muted);}

  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px 20px;}
  .field{display:flex;flex-direction:column;gap:6px;}
  .field.full{grid-column:1 / -1;}
  .field label{font-size:12.5px;font-weight:600;color:var(--text);}
  .field input,.field select,.field textarea{padding:9px 11px;border:1px solid var(--line);border-radius:8px;font-size:13px;font-family:inherit;background:#fff;}
  .field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(31,95,174,.12);}
  .form-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;padding-top:16px;border-top:1px solid var(--line);}

  .grid2{display:grid;grid-template-columns:2fr 1fr;gap:20px;}
  @media(max-width:1100px){.cards{grid-template-columns:repeat(2,1fr);}.grid2{grid-template-columns:1fr;}.form-grid{grid-template-columns:1fr;}}
  @media(max-width:720px){.roles{grid-template-columns:repeat(2,1fr);}.sidebar{display:none;}}

  /* schedule grid */
  .sched{width:100%;border-collapse:collapse;font-size:12px;}
  .sched th,.sched td{border:1px solid var(--line);padding:0;text-align:center;}
  .sched th{background:#f6f8fb;padding:8px;}
  .sched td{height:46px;vertical-align:middle;}
  .slot{margin:3px;border-radius:6px;padding:5px 4px;font-size:11px;font-weight:600;line-height:1.25;}

  /* sensor */
  .sensor{display:flex;align-items:center;gap:14px;background:#0f2238;color:#fff;border-radius:12px;padding:16px 18px;}
  .sensor .dot{width:12px;height:12px;border-radius:50%;background:#35d07f;box-shadow:0 0 0 4px rgba(53,208,127,.25);}
  .sensor .dot.off{background:#e05c4b;box-shadow:0 0 0 4px rgba(224,92,75,.25);}
  .sensor .s-info b{display:block;font-size:14px;}
  .sensor .s-info small{color:#9fb4cf;}
  .pill-origin{font-size:11px;padding:2px 8px;border-radius:12px;}

  .toast{position:fixed;bottom:24px;right:24px;background:var(--nav);color:#fff;padding:13px 18px;border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.25);font-size:13px;display:flex;align-items:center;gap:10px;opacity:0;transform:translateY(12px);transition:.25s;z-index:50;}
  .toast.show{opacity:1;transform:translateY(0);}
  .note{background:#eef4fb;border-left:3px solid var(--primary);border-radius:0 8px 8px 0;padding:11px 14px;font-size:12.5px;color:#30455f;margin:14px 0;}
</style>
</head>
<body>

<!-- ===================== LOGIN ===================== -->
<div id="login">

    <div class="login-head">

/* ============================ ESTADO ============================ */
let state={role:null,screen:'panel'};

/* ============================ LOGIN ============================ */
function initLogin(){
  const g=document.getElementById('roleGrid');
  g.innerHTML=Object.entries(ROLES).map(([k,r])=>`
    <div class="role" onclick="login('${k}')">
      <div class="ic">${r.ic}</div><b>${r.label}</b>
      <small>${k==='admin'?'Gestiona todo el sistema':k==='coordinador'?'Gestiona su programa':k==='docente'?'Dicta y evalúa':'Consulta su información'}</small>
    </div>`).join('');
}
function login(role){
  state.role=role;state.screen='panel';
  document.getElementById('login').style.display='none';
  document.getElementById('app').style.display='block';
  const r=ROLES[role];
  document.getElementById('sbRole').textContent=r.label;
  document.getElementById('uName').textContent=r.nombre;
  document.getElementById('uRole').textContent=r.label;
  document.getElementById('uAvatar').textContent=r.nombre.split(' ').map(x=>x[0]).slice(0,2).join('');
  render();
}
function logout(){
  document.getElementById('app').style.display='none';
  document.getElementById('login').style.display='flex';
}

/* ============================ RENDER SHELL ============================ */
function go(screen){state.screen=screen;render();window.scrollTo(0,0);}
function render(){
  const menu=MENUS[state.role];
  document.getElementById('menu').innerHTML=menu.map(([k,l,ic])=>
    `<li><a class="${state.screen===k?'active':''}" onclick="go('${k}')"><span class="mi">${ic}</span>${l}</a></li>`).join('');
  const cur=menu.find(m=>m[0]===state.screen);
  document.getElementById('crumbs').innerHTML=`Sistema Académico · <b>${cur?cur[1]:''}</b>`;
  document.getElementById('content').innerHTML=(SCREENS[state.screen]||(()=>'<p>En construcción</p>'))();
}

/* ============================ HELPERS ============================ */
function title(t,s){return `<h1 class="page-title">${t}</h1><p class="page-sub">${s||''}</p>`;}
function toolbar(ph,btn){
  return `<div class="toolbar">
    <div class="search"><span class="si">🔎</span><input placeholder="${ph||'Buscar...'}" oninput="filterTable(this)"></div>
    ${btn?`<button class="btn btn-p" onclick="${btn.fn}">+ ${btn.label}</button>`:''}
  </div>`;
}
function filterTable(inp){
  const q=inp.value.toLowerCase();
  const tb=inp.closest('.content').querySelector('tbody');
  if(!tb)return;
  [...tb.rows].forEach(r=>{r.style.display=r.textContent.toLowerCase().includes(q)?'':'none';});
}
function tablePanel(titleTxt,cols,rows,renderRow,toolbarHtml){
  return `<div class="panel">
    <div class="panel-h"><h3>${titleTxt}</h3><span class="badge b-gray">${rows.length} registros</span></div>
    <div class="panel-b">${toolbarHtml||''}</div>
    <div class="panel-b flush"><table><thead><tr>${cols.map(c=>`<th>${c}</th>`).join('')}</tr></thead>
    <tbody>${rows.map(renderRow).join('')}</tbody></table></div></div>`;
}
function toast(msg){
  const t=document.getElementById('toast');
  t.innerHTML='✅ '+msg;t.classList.add('show');
  clearTimeout(window.__tt);window.__tt=setTimeout(()=>t.classList.remove('show'),2600);
}
function saveForm(e,msg){e.preventDefault();toast(msg||'Registro guardado correctamente');go(e.target.dataset.back);return false;}

function genericForm(back,fields,msg){
  return `<div class="panel"><div class="panel-b"><form data-back="${back}" onsubmit="return saveForm(event,'${msg}')">
    <div class="form-grid">
      ${fields.map(f=>`<div class="field"><label>${f[0]}</label>${
        f[1]==='select'?`<select>${f[2].map(o=>`<option>${o}</option>`).join('')}</select>`:
        `<input required placeholder="${f[0]}">`}</div>`).join('')}
    </div>
    <div class="form-actions"><button type="button" class="btn btn-s" onclick="go('${back}')">Cancelar</button><button class="btn btn-p">Guardar</button></div>
  </form></div></div>`;
}

SCREENS.mi_horario=function(){
  return title('Mi horario','Horario del periodo 2026-2')+scheduleGrid();
};
function scheduleGrid(){
  const dias=['Lunes','Martes','Miércoles','Jueves','Viernes'];
  const horas=['14:00','16:00','18:00','20:00'];
  let body='';
  horas.forEach(h=>{
    body+=`<tr><td style="background:#f6f8fb;font-weight:600">${h}</td>`;
    dias.forEach(d=>{
      const s=(HORARIO[d]||[]).find(x=>x.h.startsWith(h.slice(0,2)));
      body+=`<td>${s?`<div class="slot" style="background:${s.c}">${s.t}<br><small>${s.a}</small></div>`:''}</td>`;
    });
    body+='</tr>';
  });
  return `<div class="panel"><div class="panel-b flush"><table class="sched"><thead><tr><th>Hora</th>${dias.map(d=>`<th>${d}</th>`).join('')}</tr></thead><tbody>${body}</tbody></table></div></div>`;
}

/* ---- ASISTENCIA (módulo estrella, con sensor) ---- */
let ASIST={registrados:[],manual:false,sensorOn:true};
SCREENS.asistencia=function(){
  if(ASIST.registrados.length===0 && !ASIST.inited){ASIST.inited=true;}
  const inscritos=DB.estudiantes.filter(e=>e.programa==='Ingeniería de Software'&&e.estado==='Activo');
  const regIds=ASIST.registrados.map(r=>r.id);
  return title('Registrar asistencia','Ingeniería de Software II · Grupo 1 · '+new Date().toLocaleDateString('es-CO'))+
  `<div class="grid2">
    <div>
      <div class="sensor" style="margin-bottom:16px">
        <span class="dot ${ASIST.sensorOn?'':'off'}"></span>
        <div class="s-info"><b>Sensor SA-201 — ${ASIST.sensorOn?'Conectado':'Sin respuesta'}</b>
          <small>Aula LAB-201 · ${ASIST.sensorOn?'Lecturas automáticas activas':'Falla del sensor — use el registro manual'}</small></div>
        <div style="margin-left:auto;display:flex;gap:8px">
          ${ASIST.sensorOn?`<button class="btn btn-p btn-sm" onclick="sensorRead()">Simular lectura del sensor</button>
            <button class="btn btn-s btn-sm" onclick="sensorFail()">Simular falla</button>`
          :`<button class="btn btn-s btn-sm" onclick="sensorRestore()">Restablecer sensor</button>`}
        </div>
      </div>
      ${!ASIST.sensorOn?`<div class="note" style="border-color:var(--bad);background:var(--badbg);color:var(--bad)">⚠️ El sensor dejó de responder. Se activó el <b>registro manual de respaldo (contingencia)</b> para no perder la asistencia del día.</div>`:''}
      ${tablePanel('Asistencia registrada',['Estudiante','Hora','Origen','Estado'],ASIST.registrados.length?ASIST.registrados:[{vacio:1}],
        r=>r.vacio?`<tr><td colspan="4" style="text-align:center;color:var(--muted);padding:26px">Aún no hay registros. ${ASIST.sensorOn?'Usa el sensor o el registro manual.':'Usa el registro manual.'}</td></tr>`:
        `<tr><td><b>${r.nombre}</b></td><td>${r.hora}</td>
         <td><span class="pill-origin ${r.origen==='sensor'?'b-info':'b-warn'}">${r.origen}</span></td>
         <td><span class="badge ${r.estado==='Presente'?'b-ok':'b-bad'}">${r.estado}</span></td></tr>`)}
    </div>
    <div class="panel"><div class="panel-h"><h3>Lista del aula (${inscritos.length})</h3></div><div class="panel-b" style="max-height:520px;overflow:auto">
      ${inscritos.map(e=>{const done=regIds.includes(e.id);return `<div style="display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line)">
        <span><b style="font-size:13px">${e.nombre}</b><br><small style="color:var(--muted)">${e.id}</small></span>
        ${done?`<span class="badge b-ok">Registrado</span>`:
          `<span style="display:flex;gap:5px"><button class="btn btn-p btn-sm" onclick="markManual('${e.id}','Presente')">Presente</button>
           <button class="btn btn-s btn-sm" onclick="markManual('${e.id}','Ausente')">Ausente</button></span>`}
      </div>`;}).join('')}
    </div></div>
  </div>
  <div class="note">Este módulo refleja el diseño del proyecto: el <b>Sensor de Asistencia</b> registra automáticamente al estudiante (clase <b>SensorAsistencia → Asistencia → DetalleAsistencia</b>), y ante una falla del sensor queda el <b>registro manual de respaldo</b> como mecanismo de contingencia.</div>`;
};
function nowHora(){return new Date().toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit'});}
function sensorRead(){
  const inscritos=DB.estudiantes.filter(e=>e.programa==='Ingeniería de Software'&&e.estado==='Activo');
  const regIds=ASIST.registrados.map(r=>r.id);
  const next=inscritos.find(e=>!regIds.includes(e.id));
  if(!next){toast('Todos los estudiantes ya fueron registrados');return;}
  ASIST.registrados.push({id:next.id,nombre:next.nombre,hora:nowHora(),origen:'sensor',estado:'Presente'});
  toast('Sensor: '+next.nombre.split(' ')[0]+' registrado');render();
}
function markManual(id,estado){
  const e=DB.estudiantes.find(x=>x.id===id);
  ASIST.registrados.push({id,nombre:e.nombre,hora:nowHora(),origen:'manual',estado});
  toast('Registro manual: '+e.nombre.split(' ')[0]+' — '+estado);render();
}
function sensorFail(){ASIST.sensorOn=false;toast('Se simuló una falla del sensor');render();}
function sensorRestore(){ASIST.sensorOn=true;toast('Sensor restablecido');render();}

/* ---- ESTUDIANTE ---- */
SCREENS.mis_asistencias=function(){
  const pres=MIS_ASIST.filter(a=>a.estado==='Presente').length;
  return title('Mis asistencias','Ingeniería de Software II · Periodo 2026-2')+
  `<div class="cards">
    ${stat('📅','#e7f0fb',MIS_ASIST.length,'Clases registradas')}
    ${stat('✅','#e5f5ec',pres,'Asistencias')}
    ${stat('❌','#fbe9e7',MIS_ASIST.length-pres,'Inasistencias')}
    ${stat('📊','#f0e9fb',Math.round(pres/MIS_ASIST.length*100)+'%','Cumplimiento')}
  </div>`+
  tablePanel('Historial de asistencia',['Fecha','Materia','Origen','Estado'],MIS_ASIST,
    a=>`<tr><td>${a.fecha}</td><td>${a.materia}</td>
    <td><span class="pill-origin ${a.origen==='sensor'?'b-info':'b-warn'}">${a.origen}</span></td>
    <td><span class="badge ${a.estado==='Presente'?'b-ok':'b-bad'}">${a.estado}</span></td></tr>`);
};
SCREENS.mi_microcurriculo=function(){return SCREENS.ver_microcurriculo().replace('go(\'microcurriculos\')','go(\'panel\')');};

/* ============================ INIT ============================ */
initLogin();
</script>
